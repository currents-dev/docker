# RustFS service configuration
# S3-compatible object storage - usually excluded when using external S3/cloud storage

services:
  rustfs:
    hostname: rustfs
    image: ${DC_RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    ports:
      - ${DC_RUSTFS_S3_PORT:-9000}:9000  # S3 API port
      - ${DC_RUSTFS_CONSOLE_PORT:-9001}:9001  # Web console port
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      # The dashboard and https://trace.playwright.dev fetch objects from the
      # browser through presigned URLs. RustFS sends no CORS headers unless this
      # or a bucket CORS rule is set.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    env_file:
      - .env
    networks:
      - default
    volumes:
      - ${DC_RUSTFS_VOLUME:-./data/rustfs}:/data  # /data is RustFS's default storage location
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/health || exit 1']
      interval: 2s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: ${DC_AWS_CLI_IMAGE:-amazon/aws-cli:2.32.31}
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      ARTIFACT_BUCKET: ${FILE_STORAGE_BUCKET:-currents}
      APP_CONTENT_BUCKET: ${APP_CONTENT_STORAGE_BUCKET:-currents-app-content}
      DELETE_ARTIFACTS_AFTER_DAYS: ${DC_RUSTFS_DELETE_ARTIFACTS_AFTER_DAYS:-}
    # The app-content rules expire share markdown a day after its link and trace
    # links after their longest lifetime. Never bucket-wide: the same bucket keeps
    # organization logos and session files for good. This init owns both buckets'
    # lifecycle configuration and replaces it on every run.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for bucket in "$$ARTIFACT_BUCKET" "$$APP_CONTENT_BUCKET"; do
          # A create that loses a race to another init finds the bucket there.
          aws s3api head-bucket --bucket "$$bucket" 2>/dev/null ||
            aws s3 mb "s3://$$bucket" ||
            aws s3api head-bucket --bucket "$$bucket"
        done
        aws s3api put-bucket-lifecycle-configuration --bucket "$$APP_CONTENT_BUCKET" --lifecycle-configuration '{
          "Rules": [
            { "ID": "ai-context-share", "Status": "Enabled", "Filter": { "Prefix": "ai-context-share/" }, "Expiration": { "Days": 2 } },
            { "ID": "share-3d", "Status": "Enabled", "Filter": { "Prefix": "share-3d/" }, "Expiration": { "Days": 4 } },
            { "ID": "share-7d", "Status": "Enabled", "Filter": { "Prefix": "share-7d/" }, "Expiration": { "Days": 8 } },
            { "ID": "trace-links", "Status": "Enabled", "Filter": { "Prefix": "trace-links/" }, "Expiration": { "Days": 8 } }
          ]
        }'
        if [ -n "$$DELETE_ARTIFACTS_AFTER_DAYS" ]; then
          case "$$DELETE_ARTIFACTS_AFTER_DAYS" in
            *[!0-9]* | 0*) echo "DC_RUSTFS_DELETE_ARTIFACTS_AFTER_DAYS must be a whole number of days above 0" >&2; exit 1 ;;
          esac
          aws s3api put-bucket-lifecycle-configuration --bucket "$$ARTIFACT_BUCKET" --lifecycle-configuration "{
            \"Rules\": [{ \"ID\": \"delete-artifacts-after-days\", \"Status\": \"Enabled\", \"Filter\": { \"Prefix\": \"\" }, \"Expiration\": { \"Days\": $$DELETE_ARTIFACTS_AFTER_DAYS } }]
          }"
        else
          aws s3api delete-bucket-lifecycle --bucket "$$ARTIFACT_BUCKET"
        fi
    networks:
      - default

  # Enable RustFS storage routing in Traefik
  traefik:
    environment:
      TRAEFIK_ENABLE_STORAGE: "true"

  # Configure Currents services to use path-style S3 URLs (required for RustFS)
  director:
    environment:
      FILE_STORAGE_FORCE_PATH_STYLE: "true"

  api:
    environment:
      FILE_STORAGE_FORCE_PATH_STYLE: "true"
      PERMANENT_STORAGE_FORCE_PATH_STYLE: "true"

  changestreams-worker:
    environment:
      FILE_STORAGE_FORCE_PATH_STYLE: "true"
      PERMANENT_STORAGE_FORCE_PATH_STYLE: "true"

  write-worker:
    environment:
      FILE_STORAGE_FORCE_PATH_STYLE: "true"
      PERMANENT_STORAGE_FORCE_PATH_STYLE: "true"

  scheduler:
    environment:
      FILE_STORAGE_FORCE_PATH_STYLE: "true"

  webhooks:
    environment:
      FILE_STORAGE_FORCE_PATH_STYLE: "true"
