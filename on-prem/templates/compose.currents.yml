# This core Currents application services

services:
  director:
    hostname: director
    image: ${DC_CURRENTS_IMAGE_REPOSITORY:-currents-}director:${DC_CURRENTS_IMAGE_TAG:-staging}
    ports:
      - ${DC_DIRECTOR_PORT:-1234}:1234
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - default
    environment:
      CURRENTS_ENV: onprem
      EMAIL_TRANSPORTER: smtp

  api:
    hostname: api
    image: ${DC_CURRENTS_IMAGE_REPOSITORY:-currents-}api:${DC_CURRENTS_IMAGE_TAG:-staging}
    ports:
      - ${DC_API_PORT:-4000}:4000
    restart: unless-stopped
    networks:
      - default
    env_file:
      - .env
    environment:
      CURRENTS_ENV: onprem
      INCLUDE_DASHBOARD: onprem
      BETTER_AUTH_ENABLED: "true"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_CURRENTS_PASSWORD}
      EMAIL_TRANSPORTER: smtp
      # Remote MCP at /mcp, which takes an API key or a personal access token.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      # The API verifies OAuth access tokens against its own signing keys. The
      # default URL is on APP_BASE_URL, which the container may not resolve
      # (*.localhost) or reach without going out through the proxy.
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://localhost:4000/api/auth/jwks}
      # The app-content bucket (shares, logos, session files). APP_CONTENT_STORAGE_*
      # in .env is the operator-facing name; the services read PERMANENT_STORAGE_*.
      PERMANENT_STORAGE_ENDPOINT: ${APP_CONTENT_STORAGE_ENDPOINT:-}
      PERMANENT_STORAGE_INTERNAL_ENDPOINT: ${APP_CONTENT_STORAGE_INTERNAL_ENDPOINT:-}
      PERMANENT_STORAGE_BUCKET: ${APP_CONTENT_STORAGE_BUCKET:-}
      PERMANENT_STORAGE_REGION: ${APP_CONTENT_STORAGE_REGION:-}
      PERMANENT_STORAGE_ACCESS_KEY_ID: ${APP_CONTENT_STORAGE_ACCESS_KEY_ID:-}
      PERMANENT_STORAGE_SECRET_ACCESS_KEY: ${APP_CONTENT_STORAGE_SECRET_ACCESS_KEY:-}
      PERMANENT_STORAGE_FORCE_PATH_STYLE: ${APP_CONTENT_STORAGE_FORCE_PATH_STYLE:-}
    volumes:
      - ${DC_SSO_VOLUME:-./data/sso}:/etc/currents/sso:ro

  changestreams-worker:
    image: ${DC_CURRENTS_IMAGE_REPOSITORY:-currents-}change-streams:${DC_CURRENTS_IMAGE_TAG:-staging}
    restart: unless-stopped
    networks:
      - default
    env_file:
      - .env
    environment:
      CURRENTS_ENV: onprem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_CURRENTS_PASSWORD}
      EMAIL_TRANSPORTER: smtp
      # The app-content bucket (shares, logos, session files). APP_CONTENT_STORAGE_*
      # in .env is the operator-facing name; the services read PERMANENT_STORAGE_*.
      PERMANENT_STORAGE_ENDPOINT: ${APP_CONTENT_STORAGE_ENDPOINT:-}
      PERMANENT_STORAGE_INTERNAL_ENDPOINT: ${APP_CONTENT_STORAGE_INTERNAL_ENDPOINT:-}
      PERMANENT_STORAGE_BUCKET: ${APP_CONTENT_STORAGE_BUCKET:-}
      PERMANENT_STORAGE_REGION: ${APP_CONTENT_STORAGE_REGION:-}
      PERMANENT_STORAGE_ACCESS_KEY_ID: ${APP_CONTENT_STORAGE_ACCESS_KEY_ID:-}
      PERMANENT_STORAGE_SECRET_ACCESS_KEY: ${APP_CONTENT_STORAGE_SECRET_ACCESS_KEY:-}
      PERMANENT_STORAGE_FORCE_PATH_STYLE: ${APP_CONTENT_STORAGE_FORCE_PATH_STYLE:-}

  write-worker:
    image: ${DC_CURRENTS_IMAGE_REPOSITORY:-currents-}writer:${DC_CURRENTS_IMAGE_TAG:-staging}
    restart: unless-stopped
    networks:
      - default
    env_file:
      - .env
    environment:
      CURRENTS_ENV: onprem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_CURRENTS_PASSWORD}
      EMAIL_TRANSPORTER: smtp
      # The app-content bucket (shares, logos, session files). APP_CONTENT_STORAGE_*
      # in .env is the operator-facing name; the services read PERMANENT_STORAGE_*.
      PERMANENT_STORAGE_ENDPOINT: ${APP_CONTENT_STORAGE_ENDPOINT:-}
      PERMANENT_STORAGE_INTERNAL_ENDPOINT: ${APP_CONTENT_STORAGE_INTERNAL_ENDPOINT:-}
      PERMANENT_STORAGE_BUCKET: ${APP_CONTENT_STORAGE_BUCKET:-}
      PERMANENT_STORAGE_REGION: ${APP_CONTENT_STORAGE_REGION:-}
      PERMANENT_STORAGE_ACCESS_KEY_ID: ${APP_CONTENT_STORAGE_ACCESS_KEY_ID:-}
      PERMANENT_STORAGE_SECRET_ACCESS_KEY: ${APP_CONTENT_STORAGE_SECRET_ACCESS_KEY:-}
      PERMANENT_STORAGE_FORCE_PATH_STYLE: ${APP_CONTENT_STORAGE_FORCE_PATH_STYLE:-}

  scheduler:
    image: ${DC_CURRENTS_IMAGE_REPOSITORY:-currents-}scheduler:${DC_CURRENTS_IMAGE_TAG:-staging}
    restart: unless-stopped
    networks:
      - default
    env_file:
      - .env
    environment:
      CURRENTS_ENV: onprem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_CURRENTS_PASSWORD}
      RUN_STARTUP_TASKS: "true"
      EMAIL_TRANSPORTER: smtp
    volumes:
      - ${DC_SCHEDULER_STARTUP_VOLUME:-./data/startup}:/app/packages/scheduler/dist/.startup

  webhooks:
    image: ${DC_CURRENTS_IMAGE_REPOSITORY:-currents-}webhooks:${DC_CURRENTS_IMAGE_TAG:-staging}
    restart: unless-stopped
    networks:
      - default
    env_file:
      - .env
    environment:
      CURRENTS_ENV: onprem
      EMAIL_TRANSPORTER: smtp

networks:
  default: null

