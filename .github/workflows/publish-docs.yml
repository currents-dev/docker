name: Publish Docs

# Publishes docs/ to GitHub Pages when an on-prem release is tagged, so the
# site describes the release users install, not unreleased changes on main.
# To publish a docs fix before the next release: branch from the release tag,
# cherry-pick the fix from main, and run this workflow on that branch.
on:
  push:
    tags:
      - 'on-prem/*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # main holds docs for compose and image changes that are not released
      # yet, so the published docs come only from a release plus docs fixes.
      - name: Check the ref is a release plus docs changes
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "::error::Run this on a branch cut from the release tag, not main. Tagging a release publishes main's docs."
            exit 1
          fi
          tag="on-prem/$(cat on-prem/VERSION)"
          latest=$(git tag -l 'on-prem/*' --sort=-v:refname | head -1)
          if [[ "$tag" != "$latest" ]]; then
            echo "::error::This ref is based on $tag, but the latest release is $latest. Publishing it would replace the latest docs."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" HEAD; then
            echo "::error::$tag (from on-prem/VERSION) is not an ancestor of $GITHUB_REF. Branch from the release tag."
            exit 1
          fi
          changed=$(git diff --name-only "$tag" HEAD -- . ':!docs/' ':!.github/' ':!README.md')
          if [[ -n "$changed" ]]; then
            echo "::error::Files outside docs/ differ from $tag:"
            echo "$changed"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # Links to this repo's files would otherwise show main's compose files
      # and .env.example, which can be ahead of the release.
      - name: Pin docs links to the release tag
        run: |
          find docs -name '*.md' -print0 | xargs -0 sed -i -E \
            "s#(github\.com/currents-dev/docker/(blob|tree))/main/#\1/${RELEASE_TAG}/#g"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
